services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itoc
      POSTGRES_USER: itoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itoc}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itoc"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      ITOC_DATABASE_URL: postgresql+psycopg://itoc:${DB_PASSWORD:-itoc}@db:5432/itoc
      ITOC_RUN_SCHEDULER: "false"
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8000"]
    command: sh -c "python -m app.cli migrate && python -m app.cli seed-config && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-server-header"
  worker:
    build: .
    env_file: .env
    environment:
      ITOC_DATABASE_URL: postgresql+psycopg://itoc:${DB_PASSWORD:-itoc}@db:5432/itoc
    depends_on: [api]
    command: python -m app.worker
volumes:
  pgdata:
