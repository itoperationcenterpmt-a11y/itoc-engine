services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itoc
      POSTGRES_USER: itoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itoc}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itoc"]
      interval: 5s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]
  api:
    build: .
    env_file: .env
    environment:
      ITOC_DATABASE_URL: postgresql+psycopg://itoc:${DB_PASSWORD:-itoc}@db:5432/itoc
      ITOC_RUN_SCHEDULER: "false"
    depends_on:
      db: {condition: service_healthy}
    expose: ["8000"]
    command: sh -c "python -m app.cli migrate && python -m app.cli seed-config && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-server-header --proxy-headers --forwarded-allow-ips='*'"
  proxy:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      ITOC_DATABASE_URL: postgresql+psycopg://itoc:${DB_PASSWORD:-itoc}@db:5432/itoc
    depends_on: [api]
    command: python -m app.worker
volumes:
  pgdata:
