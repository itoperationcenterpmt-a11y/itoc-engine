<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard IT Pelindo Multi Terminal</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<meta name="theme-color" content="#0f3d7a">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
[hidden]{display:none!important}
/* Satu bar filter yang sama di semua halaman; tiap halaman menyatakan filter mana yang berlaku. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --sunken:#eef1f6; --ink:#0f1a2a; --ink2:#47566a; --muted:#6b7a8d;
  --line:#e1e7ef; --axis:#c3cdd9; --accent:#1c5cab; --accent-ink:#fff; --wash:rgba(28,92,171,.09);
  --grad:linear-gradient(135deg,#0f3d7a 0%,#1c5cab 55%,#2a8bd6 100%);
  --rad:14px; --shadow:0 1px 2px rgba(15,26,42,.05),0 6px 20px -8px rgba(15,26,42,.12);
  --side-bg:#0f1b2d; --side-ink:#c5d0de; --side-act:rgba(109,167,236,.16); --side-line:rgba(255,255,255,.08);
  --s1:#2a78d6; --s2:#eb8a34; --good:#0ca30c; --warn:#e8a000; --serious:#ec835a; --crit:#d03b3b; --low:#8fa3b5;
  --good-text:#006300; --warn-text:#8a5a00; --crit-text:#b02a2a;
  --sp:#cde2fb; --ss:#86b6ef; --sm:#1c5cab; --sm-ink:#fff;
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5); --side-bg:#0a1018;
  --bg:#0e1216; --surface:#171c22; --sunken:#1f262e; --ink:#f2f5f8; --ink2:#b9c2cb; --muted:#8a96a2;
  --line:#2a323b; --axis:#3a444e; --accent:#6da7ec; --accent-ink:#0b1420; --wash:rgba(109,167,236,.13);
  --s1:#4a90e8; --s2:#e8963f; --low:#5f7284; --good-text:#3fc23f; --warn-text:#f2b84b; --crit-text:#ee7b7b;
  --sp:#184f95; --ss:#256abf; --sm:#9ec5f4; --sm-ink:#0b1420; color-scheme:dark}}
:root[data-theme="dark"]{
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5); --side-bg:#0a1018;
  --bg:#0e1216; --surface:#171c22; --sunken:#1f262e; --ink:#f2f5f8; --ink2:#b9c2cb; --muted:#8a96a2;
  --line:#2a323b; --axis:#3a444e; --accent:#6da7ec; --accent-ink:#0b1420; --wash:rgba(109,167,236,.13);
  --s1:#4a90e8; --s2:#e8963f; --low:#5f7284; --good-text:#3fc23f; --warn-text:#f2b84b; --crit-text:#ee7b7b;
  --sp:#184f95; --ss:#256abf; --sm:#9ec5f4; --sm-ink:#0b1420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:16px;font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;display:inline-flex;gap:6px;align-items:center}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);font-size:12px}

/* layout: sidebar (desktop) + bottom nav (mobile) */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:12px 10px;gap:8px;z-index:6}
.brand{display:flex;gap:10px;align-items:center;padding:2px 4px}.brand .g2{height:46px;width:auto;max-width:100%;min-width:0}.railbtn{position:absolute;top:26px;right:-13px;z-index:8;width:26px;height:26px;border-radius:50%;background:var(--side-bg);border:1px solid var(--side-line);color:var(--side-ink);cursor:pointer;display:grid;place-items:center;font-size:17px;line-height:1;padding:0 0 2px;opacity:.9;box-shadow:0 2px 8px -2px rgba(0,0,0,.5)}.railbtn:hover{opacity:1;color:#fff;background:#1b2c46}
.brand .mk{width:44px;height:44px;flex:none;display:grid;place-items:center;background:#fff;border-radius:12px;box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}
.brand .mk img{width:36px;height:36px;display:block}
.brand h1{font-size:13px;font-weight:700;color:#fff;line-height:1.25;min-width:0}
.brand h1 .b1{white-space:nowrap}
.brand h1 .b2{display:block;white-space:nowrap;font-weight:600;font-size:13px;opacity:.88;letter-spacing:.01em}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--side-ink);opacity:.7;letter-spacing:0}
.tabs{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin}
.tabs button{display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:9px;padding:7px 11px;cursor:pointer;color:var(--side-ink);font-weight:500;font-size:13.5px;text-align:left;transition:background .15s,color .15s}
.tabs button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.tabs button:hover{background:rgba(255,255,255,.06);color:#fff}
.tabs button[aria-selected="true"]{background:var(--side-act);color:#fff;box-shadow:inset 3px 0 0 #6da7ec}
.tabs button[aria-selected="true"] svg{stroke:#8dbcf4;opacity:1}
.tb{font-size:10px;padding:0 6px;border-radius:8px;margin-left:auto;font-weight:600}
.tb.warn{background:rgba(232,160,0,.22);color:#f2b84b}
.side-foot{border-top:1px solid var(--side-line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
#duty{display:flex;align-items:center;gap:8px;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:500;color:#fff;background:rgba(12,163,12,.14);border:1px solid rgba(12,163,12,.3);line-height:1.35}
#duty small{display:block;font-weight:400;opacity:.8;font-size:11.5px;margin-top:1px}#duty i{width:8px;height:8px;border-radius:50%;background:#3fc23f;flex:none;box-shadow:0 0 0 4px rgba(63,194,63,.2)}
.who{display:flex;align-items:center;gap:8px;padding:0 2px}.who .iconbtn{padding:5px 8px;flex:none}
.av{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 13px var(--f-display);flex:none}
#me{font-size:13px;font-weight:600;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-weight:400;font-size:11px;color:var(--side-ink);opacity:.7}
.who-t{min-width:0;flex:1}
.iconbtn{background:rgba(255,255,255,.07);border:1px solid var(--side-line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--side-ink);font-size:12.5px;font-weight:500}
.iconbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.side-act{display:flex;gap:6px}.side-act .iconbtn{flex:none}
@media (min-width:901px){
.shell.rail{grid-template-columns:78px minmax(0,1fr)}
.shell.rail .side{padding:12px 6px;align-items:center}
.shell.rail .brand h1,.shell.rail .tabs button span,.shell.rail .who-t,.shell.rail .tb,.shell.rail #duty span{display:none}
.shell.rail .brand{justify-content:center;padding:0}.shell.rail .brand .g2{width:46px;height:46px;object-fit:cover;object-position:left center}
.shell.rail .tabs button{justify-content:center;padding:11px}.shell.rail .tabs button svg{width:21px;height:21px}.shell.rail #duty{padding:8px;justify-content:center}
.shell.rail .side-foot{align-items:center}.shell.rail .who{flex-direction:column}.shell.rail .side-act{flex-direction:column}
}
.main{min-width:0}
.more{display:none}
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,20,.55);backdrop-filter:blur(2px)}
.sheet-box{position:relative;width:min(560px,100%);background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);max-height:85vh;overflow-y:auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet-h b{font-family:var(--f-display);font-size:17px}
.sheet-h .iconbtn,.sheet-f .iconbtn{background:var(--sunken);color:var(--ink2);border-color:var(--line)}
.sheet-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-g button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line);background:var(--bg);border-radius:14px;color:var(--ink);font-weight:600;font-size:12.5px;cursor:pointer;text-align:center;position:relative;touch-action:manipulation}
.sheet-g button svg{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-g button[aria-selected="true"]{background:var(--wash);border-color:var(--accent);color:var(--accent)}
.sheet-f{display:flex;gap:10px;margin-top:14px}.sheet-f .iconbtn{flex:1;padding:10px}
.mtop{display:none}
.wrap{max-width:1320px;margin:0 auto;padding:22px 24px 56px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
.pagehead h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.pagehead .sub{font-size:13px}
@media (max-width:900px){
  .shell{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;border-top:1px solid var(--side-line);box-shadow:0 -8px 24px -10px rgba(0,0,0,.4)}
  .side .brand,.side .side-foot{display:none}
  .tabs{flex-direction:row;gap:2px;width:auto}
  .tabs::-webkit-scrollbar{display:none}
  .tabs{overflow:visible;flex:1;min-width:0}
  .tabs button:nth-child(n+5){display:none}
  .tabs button,.more{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:7px 4px;font-size:10.5px;align-items:center;text-align:center;border-radius:12px;touch-action:manipulation}
  .tabs button span:not(.tb),.more span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{display:flex;background:none;border:0;color:var(--side-ink);cursor:pointer;font-weight:500;flex:0 0 20%;position:relative}
  .more svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .more.on{background:var(--side-act);color:#fff}
  .tabs button[aria-selected="true"]{box-shadow:none}
  .tabs button svg{width:21px;height:21px}
  .tabs .tb{position:absolute;margin:0;transform:translate(14px,-4px);font-size:9px;padding:0 4px}
  .tabs button{position:relative}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5;background:var(--grad);color:#fff;padding:12px 16px}
  .mtop .brand{padding:0}.mtop .brand .mk{width:36px;height:36px;border-radius:10px}.mtop .brand .mk img{width:29px;height:29px}
  .mtop .brand h1{font-size:12.5px;line-height:1.15;color:#fff}.mtop .brand h1 .b2{font-size:11px}.mtop .brand h1 small{display:none}.mtop .brand{min-width:0}.mtop .brand h1{min-width:0}
  .mtop .mr{display:flex;align-items:center;gap:8px;min-width:0}
  #dutyM{font-size:11px;font-weight:500;background:rgba(255,255,255,.16);border-radius:20px;padding:4px 10px;white-space:nowrap}
  .mtop .iconbtn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;padding:5px 9px}
  .wrap{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
  .pagehead h2{font-size:20px}
}

/* filter seragam */
.fwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);margin-top:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fhead{display:none}
@media (max-width:900px){
  .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:0;cursor:pointer;width:100%;text-align:left}
  .fhead b{font-family:var(--f-display);font-size:14px;display:flex;align-items:center;gap:8px}
  .fhead b svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
  .fhead .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-align:right}
  .fhead .chev{transition:transform .2s;color:var(--muted)}
  .fwrap.open .fhead .chev{transform:rotate(180deg)}
  .fwrap:not(.open) #fbar,.fwrap:not(.open) #fApplies{display:none}
  #fbar{flex-direction:column;align-items:stretch}
  .fg{flex-direction:column;align-items:stretch}
  .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .seg button{flex:1 0 auto}
  #fSite{max-width:none;width:100%}
  .dates input{flex:1}
}
#fbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fg>.k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fg.na{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);flex-wrap:wrap}
.seg button{background:none;border:0;padding:5px 10px;cursor:pointer;color:var(--ink2);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--wash);color:var(--accent);font-weight:600}
.seg button:disabled{cursor:not-allowed}
.dates{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.dates input,#fSite{width:auto;padding:4px 6px;font-size:13px}
#fSite{max-width:210px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer}
#fApplies{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:7px}
#fApplies b{color:var(--ink);font-weight:600}
.na-txt{color:var(--muted)}
.off #gPeriode,.off #gShift,.off #gSite,.off #gCmp{opacity:.4}

/* grid & panel */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1000px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:520px){.c3{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel>header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.panel>header h2{min-width:0;max-width:100%}
.panel select.pick{width:auto;max-width:100%;font-family:var(--f-display);font-weight:600;font-size:15px;padding:3px 6px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden}
.kpi{padding:13px 15px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline}
.kpi.warnv .v{color:var(--warn-text)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)}}
.dom{position:relative;overflow:hidden}
.dom::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad)}
.dom .mini{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.dom .mini .kpi{border-left:0;border-top:1px solid var(--line);padding:10px 12px}
.dom .mini .kpi:nth-child(-n+2){border-top:0}
.dom .mini .kpi:nth-child(even){border-left:1px solid var(--line)}
.dom .mini .kpi .v{font-size:23px}
.dom>header{align-items:center}
.dl{font-family:var(--f-mono);font-size:11.5px;font-weight:500}
.dl.good{color:var(--good-text)} .dl.bad{color:var(--crit-text)} .dl.flat{color:var(--muted)}
.ib{width:15px;height:15px;border-radius:50%;border:1px solid var(--axis);background:none;color:var(--muted);font:600 9.5px/1 var(--f-body);padding:0;cursor:help;text-transform:none}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;font-size:13px;align-self:flex-start}
.lnk:hover{text-decoration:underline}

.empty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:28px 12px;color:var(--muted);font-size:13px}
.empty b{color:var(--ink2);font-family:var(--f-display);font-size:15px}
.empty.sm{padding:12px 0;align-items:flex-start;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:2px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(80px,40%) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:12.5px}
.hb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tracks{display:flex;flex-direction:column;gap:2px}
.hb .track{height:9px;background:var(--sunken);border-radius:3px;overflow:hidden}
.hb .fill{height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.hb .fill.b{background:var(--s2)}
.hb .num{font-size:12px;color:var(--ink2);white-space:nowrap}
.scroll{overflow-x:auto}
.tall{max-height:420px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
td.t{min-width:90px;max-width:380px;overflow-wrap:break-word}
.crit-t{color:var(--crit-text);font-weight:600}
.warn-t{color:var(--warn-text)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;white-space:nowrap}
.pill i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff;flex:none}
.pill.good i{background:var(--good)} .pill.warn i{background:var(--warn);color:#10171e} .pill.crit i{background:var(--crit)} .pill.idle i{background:var(--low)}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:10px;background:var(--sunken);color:var(--ink2);white-space:nowrap}

/* perlu perhatian */
.att{margin:0;padding:0;display:flex;flex-direction:column}
.att li{list-style:none;display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:9px 0 9px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--warn)}
.att li.crit{border-left-color:var(--crit)}
.att li:last-child{border-bottom:0}
.att b{font-weight:600}
.att .lnk{white-space:nowrap;flex:none}

/* bertugas, serah terima */
.duty-card .big{display:flex;gap:12px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.duty-card .big b{display:block;font-family:var(--f-display);font-size:17px}

.lg-info h2{font-size:clamp(36px,5.4vw,68px);line-height:1.04}
.stbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunken);min-width:90px}.stbar i{display:block;height:100%}.stbar .u{background:var(--good)}.stbar .m{background:var(--warn)}.stbar .g{background:var(--serious)}.stbar .d{background:var(--crit)}

.laycat{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}.laycat[hidden]{display:none}.catl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-top:6px}.catw{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunken);border-radius:10px;padding:10px 12px}.catw>div{display:flex;flex-direction:column;min-width:0}.catw b{font-size:14px}.catw .btn{padding:3px 12px}
.fg[hidden]{display:none}
.dmap{width:100%;height:auto;display:block;border-radius:10px;background:var(--sunken)}
.dmapbox{width:100%;height:420px;border-radius:10px;overflow:hidden;background:var(--sunken);z-index:0}.dmapbox .leaflet-control-attribution{font-size:10px}.dmapbox{position:relative}.dmapbox::after{content:"Tahan Ctrl + scroll untuk zoom peta";position:absolute;inset:auto 0 0 0;z-index:900;text-align:center;padding:6px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s;pointer-events:none}.dmapbox.hint::after{opacity:1}
.dmap text{fill:var(--muted);font-size:11px}.dmap .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}

.dmap circle.pt{stroke:var(--surface);stroke-width:1.5;cursor:default;transition:opacity .15s}.dmap circle.pt:hover{opacity:.8}
.dmap .g{fill:var(--good)}.dmap .w{fill:var(--warn)}.dmap .c{fill:var(--crit)}.dmap .n{fill:var(--low)}.dmap .ring{fill:none;stroke:var(--crit);stroke-width:2;opacity:.35}
.dmap text.lb{fill:var(--ink);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--sunken);stroke-width:3px}
.dtool{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lay-edit .wblock.off{display:none}
.layoff{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px}.layoff:empty{display:none}

.catp{display:flex;gap:6px;align-items:center}.catp select{max-width:170px;padding:3px 6px;font-size:12px}

input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}

.dutychip{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:7px 16px;font-size:15px;font-weight:600;color:var(--ink);background:rgba(12,163,12,.12);border:1px solid rgba(12,163,12,.35);line-height:1.3;white-space:nowrap}
.dutychip small{font-weight:500;font-size:14px;opacity:.85;margin-left:8px;padding-left:10px;border-left:1px solid currentColor;font-variant-numeric:tabular-nums}.dutychip i{width:10px;height:10px;border-radius:50%;background:#3fc23f;flex:none;box-shadow:0 0 0 3px rgba(63,194,63,.2)}
@media (min-width:901px){
.wrap{max-width:none;margin:0;padding:16px 22px 44px}
.fg{flex-wrap:nowrap}.fg select{width:auto;min-width:140px;max-width:230px}

}

.rowlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 2px 6px}
#subnav .subtabs{margin:0 0 12px}
.rbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 32px;margin-bottom:14px}
.rgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.rgroup .chips,.rgroup .rdl{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0}
.rgroup .chip{white-space:nowrap}
.rgroup .rdl .btn{min-width:112px;justify-content:center}
.dutychip{position:relative;overflow:hidden}
.dutychip::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);animation:dutysheen 5.5s ease-in-out infinite;pointer-events:none}
.dutychip i{animation:dutypulse 1.8s ease-out infinite}
.dutychip .clk{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em}
.dutychip .clk b{display:inline-block;animation:dutyblink 1s steps(1) infinite;font-weight:700;padding:0 1px}
@keyframes dutypulse{0%{box-shadow:0 0 0 0 rgba(63,194,63,.65)}70%{box-shadow:0 0 0 9px rgba(63,194,63,0)}100%{box-shadow:0 0 0 0 rgba(63,194,63,0)}}
@keyframes dutysheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes dutyblink{0%,49%{opacity:1}50%,100%{opacity:.25}}

.stiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--sunken);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink);cursor:pointer;font:inherit;transition:transform .15s,border-color .15s}

.stile.good{border-left-color:var(--good)}.stile.warn{border-left-color:var(--warn)}.stile.crit{border-left-color:var(--crit)}
.stile.crit b{color:var(--crit)}.stile.warn b{color:var(--warn)}

.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400}.chk input{width:auto}
.todohead{padding:12px 16px;border-radius:12px;font-weight:600;margin-bottom:12px;background:var(--sunken);border-left:5px solid var(--good)}.todohead.warn{border-left-color:var(--warn)}

</style>
